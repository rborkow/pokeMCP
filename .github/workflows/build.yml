name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR validation, but never interrupt a main release between
  # the provider Worker and the web Worker.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-worker:
    name: Build internal analysis worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify data files
        run: |
          test -f src/data/pokedex.ts
          test -f src/data/items.ts
          test -f src/data/formats-data.ts
          echo "✅ Data files present"

      - name: Typecheck
        run: bun run type-check

      - name: Unit tests
        run: bun run test

      - name: Validate Cloudflare relaunch scripts
        run: |
          bash -n scripts/cloudflare/backup-d1.sh
          bash -n scripts/cloudflare/capture-state.sh
          bash -n scripts/cloudflare/relaunch-preflight.sh

      - name: Validate D1 migrations
        run: bun run test:migrations

      - name: Check generated Cloudflare types
        run: bunx wrangler types --check

      - name: Build check (dry run)
        run: bunx wrangler deploy --dry-run --env production --outdir=dist

  build-teambuilder:
    name: Build Teambuilder
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/teambuilder/package.json

      - name: Install dependencies
        working-directory: ./apps/teambuilder
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./apps/teambuilder
        run: bun run lint

      - name: Unit tests
        working-directory: ./apps/teambuilder
        run: bun run test:run

      - name: Build production Worker
        working-directory: ./apps/teambuilder
        run: bun run pages:bundle

      # The generated binding types resolve .open-next/worker, so this must run
      # after a clean runner has produced the OpenNext Worker entrypoint.
      - name: Check generated Cloudflare types
        working-directory: ./apps/teambuilder
        run: bun run cf-typecheck

      - name: Typecheck generated routes
        working-directory: ./apps/teambuilder
        run: bun run type-check

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/docs/package.json

      - name: Install dependencies
        working-directory: ./apps/docs
        run: bun install --frozen-lockfile

      - name: Build documentation
        working-directory: ./apps/docs
        run: bun run build

      - name: Success
        run: echo "✅ All builds passed"

  build-pokemonitor:
    name: Build pokemonitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/pokemonitor/package.json

      - name: Install dependencies
        working-directory: ./apps/pokemonitor
        run: bun install --frozen-lockfile

      - name: Unit tests
        working-directory: ./apps/pokemonitor
        run: bun run test

      - name: Typecheck
        working-directory: ./apps/pokemonitor
        run: bun run type-check

      - name: Lint
        working-directory: ./apps/pokemonitor
        run: bun run lint

      - name: Build check (dry run)
        working-directory: ./apps/pokemonitor
        run: bunx wrangler deploy --dry-run --outdir=dist

  deploy-production:
    name: Deploy production
    needs:
      - build-worker
      - build-teambuilder
      - build-docs
      - build-pokemonitor
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      target: all
    secrets: inherit
