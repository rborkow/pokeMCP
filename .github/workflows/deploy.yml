name: Deploy production

# This workflow is called by Build and Test only after every release gate passes
# on main. It remains manually runnable for a deliberate retry or partial deploy.
# D1 migrations are applied separately after a release backup; this workflow
# refuses to deploy while either database has pending migrations.
on:
  workflow_call:
    inputs:
      target:
        description: "What to deploy"
        required: false
        default: "all"
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - worker
          - teambuilder
          - pokemonitor

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy ordered Workers
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'worker' }}
        run: bun install --frozen-lockfile

      - name: Refuse deploy with pending META_DB migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'worker' }}
        run: |
          status="$(bunx wrangler d1 migrations list META_DB --remote --env production)"
          echo "$status"
          grep -q "No migrations to apply" <<< "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy pokemon-mcp-production
        if: ${{ inputs.target == 'all' || inputs.target == 'worker' }}
        run: bun run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Keep the dependent web deploy in this same protected job so each
      # coordinated release has one approval and one production status.
      - name: Install Teambuilder dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'teambuilder' }}
        working-directory: ./apps/teambuilder
        run: bun install --frozen-lockfile

      - name: Refuse deploy with pending PREP_DB migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'teambuilder' }}
        working-directory: ./apps/teambuilder
        run: |
          status="$(bunx wrangler d1 migrations list PREP_DB --remote --config wrangler.toml)"
          echo "$status"
          grep -q "No migrations to apply" <<< "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy pokemcp-teambuilder
        if: ${{ inputs.target == 'all' || inputs.target == 'teambuilder' }}
        working-directory: ./apps/teambuilder
        run: bun run deploy
        env:
          # Web Analytics beacon token — public by design (shipped in page HTML).
          # layout.tsx also hardcodes this as a fallback; set explicitly so the
          # build never depends on a gitignored .env.local.
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: 760a922acb5c4ad0bb6726211198945f
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install pokemonitor dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'pokemonitor' }}
        working-directory: ./apps/pokemonitor
        run: bun install --frozen-lockfile

      - name: Deploy pokemonitor
        if: ${{ inputs.target == 'all' || inputs.target == 'pokemonitor' }}
        working-directory: ./apps/pokemonitor
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
