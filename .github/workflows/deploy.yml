name: Deploy

# Manual production deploys from a tested main commit. D1 migrations are
# intentionally applied before this workflow, after the release backup in the
# runbook; this workflow refuses to deploy while migrations are pending.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - worker
          - teambuilder

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy internal analysis worker
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'worker') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refuse deploy with pending META_DB migrations
        run: |
          status="$(bunx wrangler d1 migrations list META_DB --remote --env production)"
          echo "$status"
          grep -q "No migrations to apply" <<< "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy pokemon-mcp-production
        run: bun run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-teambuilder:
    name: Deploy Teambuilder
    needs: deploy-worker
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        (inputs.target == 'all' || inputs.target == 'teambuilder') &&
        (inputs.target == 'teambuilder' || needs.deploy-worker.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/teambuilder/package.json

      - name: Install dependencies
        working-directory: ./apps/teambuilder
        run: bun install --frozen-lockfile

      - name: Refuse deploy with pending PREP_DB migrations
        working-directory: ./apps/teambuilder
        run: |
          status="$(bunx wrangler d1 migrations list PREP_DB --remote --config wrangler.toml)"
          echo "$status"
          grep -q "No migrations to apply" <<< "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy pokemcp-teambuilder
        working-directory: ./apps/teambuilder
        run: bun run deploy
        env:
          # Web Analytics beacon token — public by design (shipped in page HTML).
          # layout.tsx also hardcodes this as a fallback; set explicitly so the
          # build never depends on a gitignored .env.local.
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: 760a922acb5c4ad0bb6726211198945f
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
