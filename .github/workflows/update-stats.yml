name: Update Smogon Stats

on:
  # Run monthly on the 5th at 6 AM UTC (Smogon publishes stats around 1st-5th)
  schedule:
    - cron: "0 6 5 * *"

  # Manual trigger for immediate updates. With tournaments_only, skips the
  # Smogon stats refresh and report generation entirely and just pulls new
  # tournament results + regenerates event recap pages — run this after a
  # big event weekend.
  workflow_dispatch:
    inputs:
      tournaments_only:
        description: "Only fetch tournaments and regenerate event pages"
        type: boolean
        default: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      # create-pull-request opens the monthly meta-report review PR
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Need write access to push stats changes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover available formats from Smogon
        if: ${{ !inputs.tournaments_only }}
        run: bun run discover-formats

      - name: Fetch latest stats from Smogon
        if: ${{ !inputs.tournaments_only }}
        run: bun run fetch-stats

      # src/cached-stats/ is gitignored (KV is the source of truth). Keep the raw
      # monthly dumps inspectable as a workflow artifact instead of committing
      # ~146 MB of churning JSON to git.
      - name: Upload raw stats dump as workflow artifact
        if: ${{ !inputs.tournaments_only }}
        uses: actions/upload-artifact@v4
        with:
          name: smogon-stats-${{ github.run_id }}
          path: src/cached-stats/
          retention-days: 30

      - name: Upload stats to KV
        if: ${{ !inputs.tournaments_only }}
        run: bun run upload-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Append this month's snapshot to the D1 time-series (metagame evolution history).
      # KV above is the "latest" source of truth; D1 accumulates one slice per month.
      - name: Append snapshot to history (D1)
        if: ${{ !inputs.tournaments_only }}
        run: bun run append-history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only the small discovery manifest is committed — the raw stats dumps in
      # src/cached-stats/ are gitignored (kept as the workflow artifact above).
      - name: Commit updated discovered formats
        if: ${{ !inputs.tournaments_only }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/discovered-formats.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No discovered-formats changes to commit"
          else
            git commit -m "chore: update discovered formats ($(date +%Y-%m))"
            # The job can sit days in the production-environment approval queue,
            # so main may have moved past the pinned checkout SHA. Replay the
            # stats commit on top of the latest main before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # This step must be able to FAIL: -f makes curl exit non-zero on HTTP
      # errors, jq -e fails if the response envelope is missing the tool text,
      # and the asserts below reject the tool's "no stats" error string (tool
      # handlers return error text with HTTP 200, so shape checks alone are
      # not enough).
      - name: Verify stats update
        if: ${{ !inputs.tournaments_only }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing stats availability..."
          response=$(curl -fsS -X POST "https://api.pokemcp.com/api/tools" \
            -H "Content-Type: application/json" \
            -d '{"tool":"get_usage_stats","args":{"type":"meta_threats","format":"gen9ou","limit":5}}')
          # /api/tools envelope: {"jsonrpc":"2.0","result":{"content":[{"type":"text","text":"..."}]}}
          if ! text=$(jq -er '.result.content[0].text' <<< "$response"); then
            echo "::error::Unexpected /api/tools response envelope: $response"
            exit 1
          fi
          echo "$text"
          if [[ "$text" == "No usage statistics found"* ]]; then
            echo "::error::API reports no stats for gen9ou — the KV upload did not take effect"
            exit 1
          fi
          if ! grep -q "% usage" <<< "$text"; then
            echo "::error::Response does not look like a usage-threats list"
            exit 1
          fi
          echo "✅ Stats update complete! KV is live immediately; any discovered-formats push to main triggers a Cloudflare Workers Builds redeploy."

      # Pull recent tournament results + teams from the Limitless platform into
      # the committed cache (drives the report's "Tournament results" section,
      # event recap pages, and common-builds data).
      - name: Fetch tournament results (Limitless)
        run: bun run fetch-tournaments
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}

      # Generate meta-report MDX + per-Pokémon trend data from the fresh stats.
      # Deterministic tables come from Smogon data; the narrative needs
      # ANTHROPIC_API_KEY (repo secret). Goes out as a PR — not a direct push —
      # so a human reviews/edits the narrative before it publishes.
      - name: Generate meta reports
        if: ${{ !inputs.tournaments_only }}
        run: bun run generate-reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Regenerate event pages only
        if: ${{ inputs.tournaments_only }}
        run: EVENTS_ONLY=1 bun run generate-reports

      - name: Open meta-report review PR
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            apps/teambuilder/src/content/reports/**
            apps/teambuilder/src/data/mons/**
            apps/teambuilder/src/data/events/**
            src/cached-tournaments/**
          branch: chore/meta-reports
          base: main
          commit-message: "content(reports): monthly meta report refresh"
          title: "Monthly meta reports — review before publish"
          body: |
            Auto-generated meta reports, per-Pokémon trend data, and tournament
            event pages from this month's Smogon stats + Limitless results.
            Review the narrative sections (everything below the tables) before
            merging — the tables are deterministic and trace to the raw data.

            Merging publishes to https://www.pokemcp.com/reports via Workers Builds.
