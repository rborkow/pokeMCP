name: Update Smogon Stats

on:
  # Run monthly on the 5th at 6 AM UTC (Smogon publishes stats around 1st-5th)
  schedule:
    - cron: "0 6 5 * *"

  # Manual trigger for immediate updates. With tournaments_only, skips the
  # Smogon stats refresh and report generation entirely and just pulls new
  # tournament results + regenerates event recap pages — run this after a
  # big event weekend.
  workflow_dispatch:
    inputs:
      tournaments_only:
        description: "Only fetch tournaments and regenerate event pages"
        type: boolean
        default: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      # create-pull-request opens the monthly meta-report review PR
      pull-requests: write
      # dispatches build.yml on the PR branch (see "Run PR checks" below)
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Need write access to push stats changes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover available formats from Smogon
        if: ${{ !inputs.tournaments_only }}
        run: bun run discover-formats

      - name: Fetch latest stats from Smogon
        if: ${{ !inputs.tournaments_only }}
        run: bun run fetch-stats

      # src/cached-stats/ is gitignored (KV is the source of truth). Keep the raw
      # monthly dumps inspectable as a workflow artifact instead of committing
      # ~146 MB of churning JSON to git.
      - name: Upload raw stats dump as workflow artifact
        if: ${{ !inputs.tournaments_only }}
        uses: actions/upload-artifact@v4
        with:
          name: smogon-stats-${{ github.run_id }}
          path: src/cached-stats/
          retention-days: 30

      - name: Upload stats to KV
        if: ${{ !inputs.tournaments_only }}
        run: bun run upload-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Append this month's snapshot to the D1 time-series (metagame evolution history).
      # KV above is the "latest" source of truth; D1 accumulates one slice per month.
      - name: Append snapshot to history (D1)
        if: ${{ !inputs.tournaments_only }}
        run: bun run append-history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # src/discovered-formats.json (the small discovery manifest) is no longer pushed
      # straight to main: the main ruleset (scripts/github/apply-review-settings.sh) requires
      # PRs and build checks, so it rides along in the review PR opened below. Nothing in the Worker reads it; only scripts/ do.

      # Reads each regulation's `{format}:_index` back from KV and compares it
      # with the snapshot fetched above. Fails if the upload did not take
      # effect. (The previous check called /api/tools, retired in July 2026;
      # its 410 failed every run here and skipped everything below.)
      - name: Verify stats update
        if: ${{ !inputs.tournaments_only }}
        run: bun run verify-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pull recent tournament results + teams from the Limitless platform into
      # the committed cache (drives the report's "Tournament results" section,
      # event recap pages, and common-builds data).
      - name: Fetch tournament results (Limitless)
        run: bun run fetch-tournaments
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}

      # Generate meta-report MDX + per-Pokémon trend data from the fresh stats.
      # Deterministic tables come from Smogon data; the narrative needs
      # ANTHROPIC_API_KEY (repo secret). Goes out as a PR — not a direct push —
      # so a human reviews/edits the narrative before it publishes.
      - name: Generate meta reports
        if: ${{ !inputs.tournaments_only }}
        run: bun run generate-reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Regenerate event pages only
        if: ${{ inputs.tournaments_only }}
        run: EVENTS_ONLY=1 bun run generate-reports

      - name: Open meta-report review PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/discovered-formats.json
            apps/teambuilder/src/content/reports/**
            apps/teambuilder/src/data/mons/**
            apps/teambuilder/src/data/events/**
            src/cached-tournaments/**
          branch: chore/meta-reports
          base: main
          commit-message: "content(reports): monthly meta report refresh"
          title: "Monthly meta reports — review before publish"
          body: |
            Auto-generated meta reports, per-Pokémon trend data, tournament event
            pages and the Smogon format manifest, from this month's Smogon stats and
            Limitless results.

            Review the whole diff before merging, tables included:
            - The narrative is LLM-written: check its claims against the tables.
            - Tournament tables, event names, player names and the
              `src/cached-tournaments/` JSON are third-party Limitless text. They are
              compiled as MDX at build time, so look for `{`, `}`, `<` or `>` in them.
              See REVIEW.md ("Generated content").

            Build checks are dispatched by the workflow that opened this PR (PRs
            opened by `GITHUB_TOKEN` don't trigger CI on their own).

            Merging publishes to https://www.pokemcp.com/reports.

      # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so the required
      # build checks would never report. workflow_dispatch is exempt from that rule: run
      # build.yml on the PR branch so its checks attach to the PR's head commit.
      - name: Run PR checks
        if: ${{ steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated' }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref chore/meta-reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
