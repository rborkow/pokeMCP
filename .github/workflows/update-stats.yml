name: Update Smogon Stats

on:
  # Run monthly on the 5th at 6 AM UTC (Smogon publishes stats around 1st-5th)
  schedule:
    - cron: "0 6 5 * *"

  # Manual trigger for immediate updates
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need write access to push stats changes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover available formats from Smogon
        run: bun run discover-formats

      - name: Fetch latest stats from Smogon
        run: bun run fetch-stats

      - name: Upload stats to KV
        run: bun run upload-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Append this month's snapshot to the D1 time-series (metagame evolution history).
      # KV above is the "latest" source of truth; D1 accumulates one slice per month.
      - name: Append snapshot to history (D1)
        run: bun run append-history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit updated stats
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/cached-stats/ src/discovered-formats.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore: update Smogon stats and discovered formats ($(date +%Y-%m))"
            git push
          fi

      - name: Verify stats update
        run: |
          echo "Testing stats availability..."
          curl -s -X POST "https://api.pokemcp.com/api/tools" \
            -H "Content-Type: application/json" \
            -d '{"tool":"get_usage_stats","args":{"type":"meta_threats","format":"gen9ou","limit":5}}' \
            | head -c 500
          echo ""
          echo "✅ Stats update complete! Push to main will trigger Cloudflare Workers Builds redeploy."
