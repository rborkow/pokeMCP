# Cloudflare Workers configuration for www.pokemcp.com (the content site)
name = "pokemcp-teambuilder"
compatibility_date = "2026-07-12"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# The site needs no runtime variables or secrets. The Cloudflare Web Analytics
# token is NOT a runtime var — NEXT_PUBLIC_* is inlined by Next at build time.
# Set NEXT_PUBLIC_CF_ANALYTICS_TOKEN in .env.local (local deploy) or the deploy
# workflow (CI). See .env.example.

# Tournament results and usage history, shared with the MCP worker. Read-only
# from here: the worker's daily job writes it.
[[d1_databases]]
binding = "META_DB"
database_name = "pokemcp-meta-history"
database_id = "64752654-621e-4f0d-be90-3e200e73097c"

# Shared usage-analytics dataset (written by the MCP Worker, read by the admin
# dashboard and pokemonitor).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "pokemcp-analytics"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
