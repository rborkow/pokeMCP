# Cloudflare Workers configuration for PokeMCP Team Builder
name = "pokemcp-teambuilder"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NEXT_PUBLIC_MCP_URL = "https://api.pokemcp.com"
# NOTE: the Cloudflare Web Analytics token is NOT a runtime var — NEXT_PUBLIC_*
# is inlined by Next at build time. Set NEXT_PUBLIC_CF_ANALYTICS_TOKEN in
# .env.local (local deploy) or a Workers Builds env var (CI). See .env.example.
# Secrets (set via `wrangler secret put` or Cloudflare dashboard):
# - ANTHROPIC_API_KEY
# - CLOUDFLARE_AI_GATEWAY_URL (contains account ID)
# - CF_AIG_TOKEN

# Shared usage-analytics dataset (also written by the MCP Worker and read by the
# admin dashboard + pokemonitor). The AI routes write `ai_chat` events here.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "pokemcp-analytics"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Cloudflare Rate Limiting bindings for the paid AI streaming routes (open
# beta — config-only, no resource to provision). Two tiers: chat (20/min) and
# the heavier synthesis/report routes (6/min). Keys are namespaced per route
# in src/lib/api/ai-guard.ts, so routes sharing a binding keep separate
# per-IP buckets. Local dev and tests fall back to an in-memory limiter when
# the bindings are absent.
[[unsafe.bindings]]
name = "AI_RATE_LIMITER_CHAT"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "AI_RATE_LIMITER_STRICT"
type = "ratelimit"
namespace_id = "1102"
simple = { limit = 6, period = 60 }
